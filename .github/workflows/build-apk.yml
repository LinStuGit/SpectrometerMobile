name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 预装 Android SDK，直接用 sdkmanager 装所需组件，
      # 不用 android-actions/setup-android（该 action 在 Node 24 下失败）
      - name: Locate Android SDK and install components
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: spectrometer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: spectrometer-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Build summary
        run: |
          echo "## APK 构建完成" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: app/build/outputs/apk/debug/" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: app/build/outputs/apk/release/" >> $GITHUB_STEP_SUMMARY
          ls -lh app/build/outputs/apk/debug/*.apk app/build/outputs/apk/release/*.apk >> $GITHUB_STEP_SUMMARY
